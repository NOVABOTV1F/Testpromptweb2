<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAXUI - Prompt Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0f7ff;
      min-height: 100vh;
    }
    .sky {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, #0a1628 0%, #000 70%);
    }
    .star {
      position: absolute; width: 2px; height: 2px; background: #b3e5fc;
      border-radius: 50%; box-shadow: 0 0 4px #81d4fa;
      animation: twinkle var(--d) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; } 50% { opacity: 1; }
    }

    /* LOGIN SCREEN */
    #loginScreen {
      position: relative; z-index: 1;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .login-box {
      width: 100%; max-width: 400px; background: rgba(5,15,25,0.9);
      border: 1px solid rgba(79,195,247,0.4); border-radius: 16px;
      padding: 28px; text-align: center;
      box-shadow: 0 0 30px rgba(79,195,247,0.15);
    }
    .login-box h1 {
      font-size: 26px; color: #4fc3f7; margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(79,195,247,0.5);
    }
    .login-box p { color: #81d4fa; font-size: 13px; margin-bottom: 22px; opacity: 0.8; }
    .login-box input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid rgba(79,195,247,0.4); background: rgba(0,0,0,0.5);
      color: #e0f7ff; font-size: 16px; text-align: center;
      letter-spacing: 1px; margin-bottom: 16px;
    }
    .login-box input:focus { outline: none; border-color: #4fc3f7; }
    .btn-login {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #0277bd, #4fc3f7);
      color: #000; font-weight: 800; font-size: 16px; cursor: pointer;
    }
    .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
    .error-msg.show { display: block; }

    /* MAIN SCREEN */
    #mainScreen { display: none; position: relative; z-index: 1; padding-bottom: 40px; }
    #mainScreen.active { display: block; }

    .top-video {
      width: 100%; max-width: 600px; margin: 0 auto 16px;
      border-radius: 0 0 14px 14px; overflow: hidden;
      border: 1px solid rgba(79,195,247,0.25);
    }
    .top-video video { width: 100%; display: block; max-height: 220px; object-fit: cover; }

    .search-wrap {
      padding: 0 16px 16px; max-width: 600px; margin: 0 auto;
    }
    .search-wrap input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid rgba(79,195,247,0.35); background: rgba(5,15,25,0.9);
      color: #e0f7ff; font-size: 15px;
    }
    .search-wrap input:focus { outline: none; border-color: #4fc3f7; }

    .prompt-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px; padding: 0 16px; max-width: 600px; margin: 0 auto;
    }
    .prompt-card {
      background: rgba(5,15,25,0.9); border: 1px solid rgba(79,195,247,0.3);
      border-radius: 12px; padding: 14px; text-align: center; cursor: pointer;
      transition: all 0.2s;
    }
    .prompt-card:hover { border-color: #4fc3f7; box-shadow: 0 0 16px rgba(79,195,247,0.2); }
    .prompt-logo {
      width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px;
      background: linear-gradient(135deg, #0277bd, #4fc3f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #000;
    }
    .prompt-by { font-size: 12px; color: #81d4fa; margin-bottom: 4px; }
    .prompt-rarity {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; display: inline-block;
    }
    .rarity-mudah { background: rgba(76,175,80,0.2); color: #81c784; }
    .rarity-sedang { background: rgba(255,193,7,0.2); color: #ffd54f; }
    .rarity-epic { background: rgba(156,39,176,0.2); color: #ce93d8; }
    .rarity-legenda { background: rgba(255,87,34,0.2); color: #ff8a65; }
    .rarity-mitik { background: rgba(244,67,54,0.25); color: #ef9a9a; }
    .rarity-infinity { background: linear-gradient(90deg,#4fc3f7,#ce93d8); color: #000; }

    /* Modal Prompt */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: #0d1a2a; border: 1px solid rgba(79,195,247,0.4);
      border-radius: 16px; padding: 24px; width: 100%; max-width: 420px;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-box h3 { color: #4fc3f7; margin-bottom: 12px; }
    .modal-box .meta { font-size: 13px; color: #81d4fa; margin-bottom: 8px; }
    .modal-box .prompt-text {
      background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px;
      font-size: 14px; line-height: 1.5; margin: 12px 0; white-space: pre-wrap;
    }
    .modal-box .status {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700; margin-top: 8px;
    }
    .status-pending { background: rgba(255,193,7,0.2); color: #ffd54f; }
    .status-sukses { background: rgba(76,175,80,0.2); color: #81c784; }
    .btn-close {
      margin-top: 16px; width: 100%; padding: 12px; border: none;
      border-radius: 10px; background: #4fc3f7; color: #000;
      font-weight: 700; cursor: pointer;
    }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; max-width: 600px; margin: 0 auto;
    }
    .header-bar .user-key {
      font-size: 12px; color: #81d4fa; opacity: 0.8;
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-logout {
      background: transparent; border: 1px solid #4fc3f7; color: #4fc3f7;
      padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sky" id="sky"></div>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>MAXUI</h1>
      <p>Masukkan key untuk masuk</p>
      <input type="text" id="keyInput" placeholder="MAXUI_XXXX_XXXX_XXXX" autocomplete="off">
      <button class="btn-login" onclick="doLogin()">MASUK</button>
      <div class="error-msg" id="loginError">Key tidak valid atau sudah expired</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div class="header-bar">
      <div class="user-key" id="userKeyDisplay">—</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>

    <div class="top-video">
      <video autoplay loop muted playsinline>
        <source src="https://raw.githubusercontent.com/NOVABOTV1F/BOT_KEY_WEB/main/tiktokio.com1791268330_39vUti4Rh3XA5sskjclN.mp4" type="video/mp4">
      </video>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Cari prompt..." oninput="filterPrompts()">
    </div>

    <div class="prompt-grid" id="promptGrid">
      <!-- Prompt cards will be injected here -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="promptModal">
    <div class="modal-box">
      <h3 id="modalTitle">Prompt</h3>
      <div class="meta" id="modalBy">By: —</div>
      <div class="meta" id="modalRarity">Rarity: —</div>
      <div class="prompt-text" id="modalPrompt">—</div>
      <div class="meta" id="modalKet">Keterangan: —</div>
      <div class="status" id="modalStatus">Pending</div>
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script>
    // Bintang
    (function() {
      var sky = document.getElementById('sky');
      for (var i = 0; i < 50; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random()*100 + '%';
        s.style.top = Math.random()*100 + '%';
        s.style.setProperty('--d', (1.5 + Math.random()*3) + 's');
        sky.appendChild(s);
      }
    })();

    // Data prompt contoh (nanti diganti dari database)
    var prompts = [
      { id:1, by:"Admin", rarity:"Epic", prompt:"Buatkan gambar anime girl dengan gaya cyberpunk", ket:"Cocok untuk wallpaper", status:"Sukses" },
      { id:2, by:"User1", rarity:"Mudah", prompt:"Logo simple untuk toko online", ket:"Minimalis", status:"Pending" },
      { id:3, by:"User2", rarity:"Legenda", prompt:"Scene battle fantasy epik", ket:"Detail tinggi", status:"Sukses" },
      { id:4, by:"Admin", rarity:"Mitik", prompt:"Karakter infinity dengan aura biru", ket:"Khusus", status:"Sukses" },
      { id:5, by:"User3", rarity:"Sedang", prompt:"Background landscape malam berbintang", ket:"Aesthetic", status:"Pending" },
      { id:6, by:"User4", rarity:"Infinity", prompt:"Prompt rahasia infinity", ket:"Tertinggi", status:"Sukses" }
    ];

    function getSavedKey() {
      try {
        var data = JSON.parse(localStorage.getItem('mKeys') || '[]');
        var now = Date.now();
        for (var i=0; i<data.length; i++) {
          if (data[i].expiresAt > now) return data[i];
        }
      } catch(e){}
      return null;
    }

    function doLogin() {
      var input = document.getElementById('keyInput').value.trim().toUpperCase();
      var err = document.getElementById('loginError');
      err.classList.remove('show');

      if (!input) {
        err.textContent = 'Masukkan key dulu';
        err.classList.add('show');
        return;
      }

      // Cek dari localStorage (hasil dari Web 1)
      var saved = getSavedKey();
      if (saved && saved.key.toUpperCase() === input) {
        // Valid
        localStorage.setItem('maxui_logged_key', input);
        showMain(input);
        return;
      }

      // Fallback: terima key format benar (untuk testing)
      if (/^MAXUI_[A-Z0-9]{4}_[A-Z0-9]{4}_[A-Z0-9]{4}$/.test(input)) {
        localStorage.setItem('maxui_logged_key', input);
        showMain(input);
        return;
      }

      err.textContent = 'Key tidak valid atau sudah expired';
      err.classList.add('show');
    }

    function showMain(key) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').classList.add('active');
      document.getElementById('userKeyDisplay').textContent = key;
      renderPrompts(prompts);
    }

    function doLogout() {
      localStorage.removeItem('maxui_logged_key');
      document.getElementById('mainScreen').classList.remove('active');
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('keyInput').value = '';
    }

    function renderPrompts(list) {
      var grid = document.getElementById('promptGrid');
      grid.innerHTML = '';
      list.forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'prompt-card';
        card.onclick = function() { openModal(p); };
        var rarityClass = 'rarity-' + (p.rarity || 'mudah').toLowerCase();
        card.innerHTML = `
          <div class="prompt-logo">${(p.by || '?')[0]}</div>
          <div class="prompt-by">By: ${p.by}</div>
          <span class="prompt-rarity ${rarityClass}">${p.rarity}</span>
        `;
        grid.appendChild(card);
      });
    }

    function filterPrompts() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = prompts.filter(function(p) {
        return (p.prompt + p.by + p.ket + p.rarity).toLowerCase().indexOf(q) !== -1;
      });
      renderPrompts(filtered);
    }

    function openModal(p) {
      document.getElementById('modalTitle').textContent = 'Detail Prompt';
      document.getElementById('modalBy').textContent = 'By: ' + p.by;
      document.getElementById('modalRarity').textContent = 'Rarity: ' + p.rarity;
      document.getElementById('modalPrompt').textContent = p.prompt;
      document.getElementById('modalKet').textContent = 'Keterangan: ' + p.ket;
      var st = document.getElementById('modalStatus');
      st.textContent = p.status;
      st.className = 'status ' + (p.status === 'Sukses' ? 'status-sukses' : 'status-pending');
      document.getElementById('promptModal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('promptModal').classList.remove('show');
    }

    // Auto login kalau sudah punya key aktif
    window.addEventListener('load', function() {
      var key = localStorage.getItem('maxui_logged_key');
      var saved = getSavedKey();
      if (key && saved && saved.key.toUpperCase() === key.toUpperCase()) {
        showMain(key);
      } else if (key) {
        // Key tersimpan tapi mungkin sudah expired di web1
        showMain(key);
      }
    });
  </script>
</body>
</html>
